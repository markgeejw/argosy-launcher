name: kaegr release

on:
  push:
    tags: ['v*-kaegr.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify checked out release tag
        run: |
          tag_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{}")
          head_commit=$(git rev-parse HEAD)
          if [ "$head_commit" != "$tag_commit" ]; then
            echo "release-checkout: HEAD does not match peeled tag $RELEASE_TAG" >&2
            exit 1
          fi
          echo "release-checkout: HEAD matches peeled tag $RELEASE_TAG"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check the fork release version
        run: >-
          python3 scripts/ci/verify_kaegr_release_version.py
          --source app/build.gradle.kts
          --tag "$RELEASE_TAG"

      - name: Run full lint
        run: >-
          ./gradlew lint -PquayPassDark
          -Pkotlin.compiler.execution.strategy=in-process
          -Dorg.gradle.jvmargs="-Xmx12g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Run debug unit tests
        run: >-
          ./gradlew testDebugUnitTest -PquayPassDark
          -Pkotlin.compiler.execution.strategy=in-process
          -Dorg.gradle.jvmargs="-Xmx12g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Run release unit tests
        run: >-
          ./gradlew testReleaseUnitTest -PquayPassDark
          -Pkotlin.compiler.execution.strategy=in-process
          -Dorg.gradle.jvmargs="-Xmx12g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KAEGR_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KAEGR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KAEGR_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "signing secrets are missing" >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          if ! keytool -list -keystore "$keystore" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null; then
            echo "the keystore has no key under the configured alias" >&2
            exit 1
          fi
          {
            echo "storeFile=$keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Build signed release
        run: >-
          ./gradlew assembleRelease -PquayPassDark
          -Pkotlin.compiler.execution.strategy=in-process
          -Dorg.gradle.jvmargs="-Xmx12g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Verify signed APK identity
        env:
          EXPECTED_SIGNER_SHA256: ${{ secrets.KAEGR_SIGNER_SHA256 }}
        run: |
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          if [ -z "$tools" ]; then
            echo "identity-tools: no Android build tools found" >&2
            exit 1
          fi
          echo "identity-tools: using $(basename "$tools")"
          apk=app/build/outputs/apk/release/app-release.apk
          signature_report="$RUNNER_TEMP/apk-signature.txt"
          badging_report="$RUNNER_TEMP/apk-badging.txt"
          if ! "$tools/apksigner" verify --verbose --print-certs "$apk" > "$signature_report" 2>&1; then
            echo "identity-signature: apksigner failed; public verifier output follows" >&2
            cat "$signature_report" >&2
            exit 1
          fi
          actual=$(grep -m1 'certificate SHA-256 digest:' "$signature_report" | cut -d: -f2- | tr -d ' :\r\n' | tr '[:upper:]' '[:lower:]')
          expected=$(printf '%s' "$EXPECTED_SIGNER_SHA256" | tr -d ' :\r\n' | tr '[:upper:]' '[:lower:]')
          if ! printf '%s' "$expected" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "identity-signer: configured signer digest is missing or malformed" >&2
            exit 1
          fi
          if [ -z "$actual" ]; then
            echo "identity-signer: apksigner report has no certificate SHA-256 digest" >&2
            cat "$signature_report" >&2
            exit 1
          fi
          if ! printf '%s' "$actual" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "identity-signer: apksigner reported a malformed certificate SHA-256 digest" >&2
            cat "$signature_report" >&2
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "identity-signer: certificate SHA-256 digest does not match configured signer" >&2
            cat "$signature_report" >&2
            exit 1
          fi
          if ! "$tools/aapt2" dump badging "$apk" > "$badging_report" 2>&1; then
            echo "identity-badging: aapt2 failed; public badging output follows" >&2
            cat "$badging_report" >&2
            exit 1
          fi
          if ! python3 scripts/ci/verify_kaegr_release_version.py \
            --source app/build.gradle.kts \
            --tag "$RELEASE_TAG" \
            --apk-badging "$badging_report"; then
            echo "identity-version: tag, version, or version code validation failed" >&2
            cat "$badging_report" >&2
            exit 1
          fi
          if ! grep -q "package: name='com.nendo.argosy.kaegr'" "$badging_report"; then
            echo "identity-package: APK package name is not com.nendo.argosy.kaegr" >&2
            cat "$badging_report" >&2
            exit 1
          fi
          if ! grep -q "versionName='${RELEASE_TAG#v}'" "$badging_report"; then
            echo "identity-version: APK version name does not match $RELEASE_TAG" >&2
            cat "$badging_report" >&2
            exit 1
          fi

      - name: Upload APK identity reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-identity-reports-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/apk-signature.txt
            ${{ runner.temp }}/apk-badging.txt
          if-no-files-found: warn

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.keystore"

      - name: Prepare draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="argosy-$RELEASE_TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$RELEASE_TAG" "$apk" \
            --repo markgeejw/argosy-launcher \
            --draft --prerelease --verify-tag \
            --title "$RELEASE_TAG" \
            --notes "Automated fork release."
