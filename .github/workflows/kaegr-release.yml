name: kaegr release

on:
  push:
    tags: ['v*-kaegr.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check the fork release version
        run: >-
          python3 scripts/ci/verify_kaegr_release_version.py
          --source app/build.gradle.kts
          --tag "$GITHUB_REF_NAME"

      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KAEGR_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KAEGR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KAEGR_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "signing secrets are missing" >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          if ! keytool -list -keystore "$keystore" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null; then
            echo "the keystore has no key under the configured alias" >&2
            exit 1
          fi
          {
            echo "storeFile=$keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Test and build
        run: >-
          ./gradlew testDebugUnitTest assembleRelease -PquayPassDark
          -Pkotlin.compiler.execution.strategy=in-process
          -Dorg.gradle.jvmargs="-Xmx12g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Verify signed APK identity
        env:
          EXPECTED_SIGNER_SHA256: ${{ secrets.KAEGR_SIGNER_SHA256 }}
        run: |
          test -n "$EXPECTED_SIGNER_SHA256"
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          apk=app/build/outputs/apk/release/app-release.apk
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-signature.txt"
          actual=$(grep -m1 'certificate SHA-256 digest:' "$RUNNER_TEMP/apk-signature.txt" | cut -d: -f2- | tr -d ' :\r\n' | tr '[:upper:]' '[:lower:]')
          expected=$(printf '%s' "$EXPECTED_SIGNER_SHA256" | tr -d ' :\r\n' | tr '[:upper:]' '[:lower:]')
          test "$actual" = "$expected"
          "$tools/aapt2" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
          python3 scripts/ci/verify_kaegr_release_version.py \
            --source app/build.gradle.kts \
            --tag "$GITHUB_REF_NAME" \
            --apk-badging "$RUNNER_TEMP/apk-badging.txt"
          grep -q "package: name='com.nendo.argosy.kaegr'" "$RUNNER_TEMP/apk-badging.txt"
          grep -q "versionName='${GITHUB_REF_NAME#v}'" "$RUNNER_TEMP/apk-badging.txt"

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.keystore"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="argosy-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" \
            --title "$GITHUB_REF_NAME" \
            --notes "Automated fork release."
